<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenix Bot - Dashboard Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Zenix Control Center</h1>
                <p class="text-slate-400 text-sm">Panel de control de prospección y atención con IA</p>
            </div>
            <label class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-semibold cursor-pointer text-sm">
                📤 Cargar Excel
                <input type="file" id="excelFile" accept=".xlsx" class="hidden" onchange="subirExcel()">
            </label>
        </header>

        <!-- Métricas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-sm">Total Registros</span>
                <div id="statTotal" class="text-3xl font-bold text-white mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-sm">Mensajes Enviados</span>
                <div id="statEnviados" class="text-3xl font-bold text-yellow-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-sm">Clientes Respondieron</span>
                <div id="statRespondidos" class="text-3xl font-bold text-green-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <span class="text-slate-400 text-sm">Demos Agendadas</span>
                <div id="statAgendados" class="text-3xl font-bold text-purple-400 mt-1">0</div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 font-semibold text-slate-300">
                Lista de Prospectos y Respuestas
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-4">Empresa / Nombre</th>
                            <th class="p-4">Teléfono</th>
                            <th class="p-4">Estado</th>
                            <th class="p-4">Último Mensaje</th>
                        </tr>
                    </thead>
                    <tbody id="tablaProspectos" class="divide-y divide-slate-700">
                        <!-- Filas dinámicas -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function cargarStats() {
            const res = await fetch('/api/stats');
            const data = await res.json();

            document.getElementById('statTotal').innerText = data.total;
            document.getElementById('statEnviados').innerText = data.enviados;
            document.getElementById('statRespondidos').innerText = data.respondidos;
            document.getElementById('statAgendados').innerText = data.agendados;

            const tbody = document.getElementById('tablaProspectos');
            tbody.innerHTML = '';

            data.prospectos.reverse().forEach(p => {
                let badgeColor = 'bg-slate-700 text-slate-300';
                if(p.estado === 'Enviado') badgeColor = 'bg-yellow-500/20 text-yellow-400';
                if(p.estado === 'Respondió') badgeColor = 'bg-green-500/20 text-green-400';
                if(p.estado === 'Agendado') badgeColor = 'bg-purple-500/20 text-purple-400';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-700/50 transition">
                        <td class="p-4 font-medium text-white">${p.nombre}</td>
                        <td class="p-4 text-slate-400">${p.telefono}</td>
                        <td class="p-4"><span class="px-2 py-1 rounded-full text-xs font-semibold ${badgeColor}">${p.estado}</span></td>
                        <td class="p-4 text-slate-300 truncate max-w-xs">${p.ultimoMensaje || '-'}</td>
                    </tr>
                `;
            });
        }

        async function subirExcel() {
            const input = document.getElementById('excelFile');
            if(!input.files[0]) return;

            const formData = new FormData();
            formData.append('archivo', input.files[0]);

            await fetch('/api/upload-excel', { method: 'POST', body: formData });
            alert('¡Archivo procesado con éxito!');
            cargarStats();
        }

        setInterval(cargarStats, 5000);
        cargarStats();
    </script>
</body>
</html>
